	"""
	itemScraped: Int!
	"""
	Fires when a media item transitions to the completed state.
	"""
	itemDownloaded: Int!
	"""
	Fires when a media item transitions to the failed state (scrape or download error).
	"""
	itemFailed: Int!
	"""
	Fires when one or more media items are deleted.
	"""
	itemsDeleted: [Int!]!
