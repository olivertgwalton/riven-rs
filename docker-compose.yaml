    riven:
        image: riven
        build: .
        env_file: .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "8080:8080"
        volumes:
            - type: bind
              source: ${RIVEN_STORAGE_PATH}
              target: /mnt/riven
              bind:
                  propagation: shared
            - riven_logs:/app/logs
        devices:
            - /dev/fuse
        cap_add:
            - SYS_ADMIN
        security_opt:
            - apparmor:unconfined
        healthcheck:
            test: ["CMD", "true"]
            interval: 2s

volumes:
    postgres_data:
    redis_data:
    plex_config:
    plex_transcode:
    seerr_data:
    jellyfin_data:
    jellyfin_cache:
    riven_logs:

networks:
    default:
        enable_ipv6: true
