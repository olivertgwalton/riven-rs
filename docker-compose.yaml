# The frontend is no longer a service: riven serves the static bundle itself
# from RIVEN_STATIC_DIR, baked into its image. Build the bundle first:
#   docker build -t riven-frontend:bundle ../riven-frontend
services:
    postgres:
        image: postgres:18-alpine
        env_file: .env
        volumes:
            - postgres_data:/var/lib/postgresql/
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riven}"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:8-alpine
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

