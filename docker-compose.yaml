# The frontend is not a service: riven serves the static bundle itself from
# RIVEN_STATIC_DIR, and the image builds it from `frontend/` in this repo. No
# separate build step.
services:
    postgres:
        image: postgres:18-alpine
        env_file: .env
        volumes:
            - postgres_data:/var/lib/postgresql/
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riven}"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:8-alpine
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5

    jellyfin:
        image: jellyfin/jellyfin:preview
        env_file: .env
        depends_on:
            riven:
                condition: service_healthy
        ports:
            - "8097:8096"
        volumes:
            - jellyfin_data:/config
            - jellyfin_cache:/cache
            - type: bind
              source: ${RIVEN_STORAGE_PATH}
              target: /mnt/riven
              read_only: true
              bind:
                  propagation: slave

    emby:
        image: lscr.io/linuxserver/emby:latest
        env_file: .env
        depends_on:
            riven:
                condition: service_healthy
        ports:
            - "8096:8096"
        volumes:
            - emby_data:/config
            - type: bind
              source: ${RIVEN_STORAGE_PATH}
              target: /mnt/riven
              read_only: true
              bind:
                  propagation: slave
            - type: bind
              source: ~/server/test-media
              target: /mnt/test-media
              read_only: true

#    plex:
#        image: plexinc/pms-docker:latest
#        env_file: .env
#        network_mode: host
#        volumes:
#            - plex_config:/config
#            - plex_transcode:/transcode
#            - type: bind
#              source: ${RIVEN_STORAGE_PATH}
#              target: /mnt/riven
#              read_only: true
#              bind:
#                  propagation: slave

    riven:
        image: riven
        build: .
        env_file: .env
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "8080:8080"
        volumes:
            - type: bind
              source: ${RIVEN_STORAGE_PATH}
              target: /mnt/riven
              bind:
                  propagation: shared
            - riven_logs:/app/logs
        devices:
            - /dev/fuse
        cap_add:
            - SYS_ADMIN
        security_opt:
            - apparmor:unconfined
        healthcheck:
            test: ["CMD", "true"]
            interval: 2s

volumes:
    postgres_data:
    redis_data:
    plex_config:
    plex_transcode:
    seerr_data:
    jellyfin_data:
    jellyfin_cache:
    emby_data:
    riven_logs:

networks:
    default:
        # Docker assigns a ULA prefix (fd00::/8) here, which is not globally
        # routable — so this does not make the unpublished postgres/redis ports
        # reachable from outside. Worth re-checking if this ever runs somewhere
        # that hands containers a global prefix instead.
        enable_ipv6: true
